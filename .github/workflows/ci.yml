name: ci

# Least privilege: the gate only checks out and runs commands.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  gate:
    # Both OSes, because the engine's failure history is platform-shaped: the locale-decode
    # class (cp1252 vs agent-produced UTF-8) and the path-separator class are invisible to a
    # Linux-only leg and were each caught after the fact on a Windows machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      # Before anything that would rewrite it. uv.lock carries the package version, and it
      # recorded 0.1.1 through the whole of 0.2.0 because `uv sync` was not part of the
      # documented cut. A test cannot catch this: `uv run` re-locks before it runs pytest,
      # so the file is already repaired by the time a test could read it. `--check` fails
      # on a stale lock instead of fixing it, which is the whole point.
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest

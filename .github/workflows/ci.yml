name: ci

# The pipeline, the commit checks and the required `gate` status come from railform, pinned
# below by `railform adopt` (the `railform` and `gate` jobs); this repository's own frame is
# railform.toml. The jobs this file does not own would go here, and `gate` waits for them too.

# Least privilege: the gate only checks out and runs commands.
permissions:
  contents: read

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  railform:
    uses: grimaldost/railform/.github/workflows/python-ci.yml@300d175b50b62a9844b480ada55435ede5ca38ab
    permissions:
      contents: read
    with:
      railform-sha: 300d175b50b62a9844b480ada55435ede5ca38ab
  gate:
    if: always()
    needs: [railform]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        shell: bash
        run: exit 1
  # <<< railform
